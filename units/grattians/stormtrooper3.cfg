#textdomain wesnoth-AoM

[unit_type]
    id=Grattian Stormtrooper3
    name= _ "Grattian Stormtrooper3"
    race=human
    image="units/grattians/stormtrooper3.png"
    hitpoints=76
    [resistances]
        blade=80
        pierce=80 
    [/resistances]
    movement_type=smallfoot
    movement=6
    experience=88
    level=3
    alignment=chaotic
    advances_to=null 
    {AMLA_DEFAULT}
    cost=34
    usage=mixed fighter
    description= _ ""
    die_sound={SOUND_LIST:HUMAN_DIE}

    {DEFENSE_ANIM "units/grattians/stormtrooper3.png" "units/grattians/stormtrooper3.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=axe
        description=_"axe"
        icon=attacks/blank-attack.png	
        type=blade
        range=melee
        damage=19
        number=2
    [/attack]

    [attack]
        name=grenade
        description=_"grenade"
        icon=attacks/blank-attack.png	
        type=impact
        range=ranged
        damage=22
        number=2
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=axe
        [/filter_attack]
        start_time=-200

        [frame]
            duration=300
        [/frame]

        {SOUND:HIT_AND_MISS axe.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=grenade
        [/filter_attack]

        start_time=-1000
        offset=0

        sling_stone_start_time=-800
        [if]
            hits=yes
            [sling_stone_frame]
                halo="projectiles/grenade.png:800"
                halo_x=24~0
                halo_y=0~-10,-10~-18,-18~-22,-22~-24,-24~-25,-25~-24,-24~-22,-22~-18,-18~-10,-10~-0
                offset=0.0~1.0
            [/sling_stone_frame]
            
            [missile_frame]
                halo="projectiles/fireball-impact-[1~16].png~SCALE(175,175):60"
                offset=1.0
                auto_vflip=false
                sound=explosion.ogg
            [/missile_frame]

            [frame]
                duration=150
            [/frame]
        [/if]
        [else]
            hits=no
                [sling_stone_frame]
                    halo="projectiles/grenade.png:900"
                    halo_x=24~0
                    halo_y=0~-10,-10~-16,-16~-20,-20~-22,-22~-20,-20~-16,-16~-10,-10~0,0~-4,-4~0,0~-2,-2~0
                    offset=0.0~1.5
                [/sling_stone_frame]
                [frame]
                    duration=150
                [/frame]
        [/else]
    [/attack_anim]
[/unit_type]