#textdomain wesnoth-AoM

[unit_type]
    id=Grattian Soldier
    name= _ "Grattian Soldier"
    race=human
    image="units/grattians/soldier.png"
    hitpoints=38
    movement_type=smallfoot
    movement=5
    experience=32
    level=1
    alignment=chaotic
    advances_to=Grattian Soldier2
    cost=13
    usage=archer
    description= _ ""
    die_sound={SOUND_LIST:HUMAN_DIE}

    {DEFENSE_ANIM "units/grattians/soldier.png" "units/grattians/soldier.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=bayonet
        description=_"bayonet"
        icon=attacks/blank-attack.png	
        type=pierce
        range=melee
        damage=7
        number=3
    [/attack]

    [attack]
        name=rifle
        description=_"rifle"
        icon=attacks/blank-attack.png	
        type=pierce
        accuracy=10
        range=ranged
        damage=18
        number=1
    [/attack]

    [attack_anim]
        [filter_attack]
            name=bayonet
        [/filter_attack]
        start_time=-200

        [frame]
            duration=300
        [/frame]

        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
    {GUN_ANIM rifle {SOUND_LIST:AOM_RIFLE} {SOUND_LIST:AOM_RIFLE_MISS}}
[/unit_type]