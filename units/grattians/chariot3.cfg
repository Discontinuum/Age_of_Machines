#textdomain wesnoth-AoM
[unit_type]
    id=Grattian Steel Chariot3
    name= _ "Grattian Steel Chariot3"
    race=mechanical
    image="units/grattians/chariot3.png"
    hitpoints=85
    [resistances]
        blade=20 
        pierce=30 
    [/resistances]
    movement_type=light_mecha
    movement=6
    vision=3
    experience=150
    level=3
    alignment=chaotic
    advances_to=null 
    {AMLA_DEFAULT}
    cost=60
    usage=archer
    die_sound=explosion.ogg
    description= _ ""

    {DEFENSE_ANIM "units/grattians/chariot3.png" "units/grattians/chariot3.png" mace.ogg}

    {AOM_MOVEMENT_SOUND motor.wav}

    [abilities] 
    [/abilities]

    attacks=3

    [attack]
        name=gun
        description=_ "machine gun"
        icon=attacks/blank-attack.png
        type=pierce
        range=ranged
        damage=16
        number=5
    [/attack]

    [attack_anim]
        [filter_attack]
            name=gun
        [/filter_attack]
        start_time=-100
        direction=se,sw 
        {MISSILE_FRAME_MACHINE_GUN 30 1}
        {SOUND:HIT_AND_MISS ckm.wav ckm.wav -50}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=gun
        [/filter_attack]
        start_time=-100
        direction=ne,nw 
        {MISSILE_FRAME_MACHINE_GUN 30 1}
        {SOUND:HIT_AND_MISS ckm.wav ckm.wav -50}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=gun
        [/filter_attack]
        start_time=-100
        direction=s
        {MISSILE_FRAME_MACHINE_GUN 15 7}
        {SOUND:HIT_AND_MISS ckm.wav ckm.wav -50}
        [frame]
            image="units/grattians/chariot3.png:50"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=gun
        [/filter_attack]
        start_time=-100
        direction=n
        {MISSILE_FRAME_MACHINE_GUN 15 -25}
        {SOUND:HIT_AND_MISS ckm.wav ckm.wav -50}
        [frame]
            image="units/grattians/chariot3.png:50"
        [/frame]
    [/attack_anim]

    [death]
		start_time=0
        [frame]
            image="units/grattians/chariot3.png"
			halo=projectiles/fireball-impact-[1~15].png~SCALE(220,220):120
        [/frame]
		sound_start_time=0
	    [sound_frame]
            sound=explosion.ogg
        [/sound_frame]
		sound2_start_time=60
	    [sound2_frame]
            sound=explosion.ogg
        [/sound2_frame]
		sound3_start_time=120
	    [sound3_frame]
            sound=explosion.ogg
        [/sound3_frame]
    [/death]
[/unit_type]