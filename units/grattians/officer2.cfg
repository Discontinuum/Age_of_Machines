            duration=300
        [/frame]

        {SOUND:HIT_AND_MISS axe.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
    {GUN_ANIM pistol revolver.ogg {SOUND_LIST:AOM_RIFLE_MISS}}
[/unit_type]